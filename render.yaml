services:
  - type: web
    name: movie-villa-backend
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/genres/
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      # Set manually in the Render dashboard once the frontend service exists —
      # its public hostname only, no scheme (e.g. movie-villa-frontend-xxxx.onrender.com).
      - key: FRONTEND_HOST
        sync: false

  - type: web
    name: movie-villa-frontend
    runtime: docker
    plan: free
    region: oregon
    rootDir: frontend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: BACKEND_SCHEME
        value: https
      # Set manually in the Render dashboard once the backend service exists —
      # its public hostname only, no scheme (e.g. movie-villa-backend-xxxx.onrender.com).
      - key: BACKEND_URL
        sync: false
